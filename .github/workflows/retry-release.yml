name: Retry verified release publication
on:
  workflow_dispatch:
    inputs:
      preflightOnly:
        description: Check private diagnostics only; do not publish a candidate
        required: false
        default: false
        type: boolean
      source_run_id:
        description: Successful build run containing an encrypted candidate
        required: true
        type: string
      kind:
        required: true
        type: choice
        options: [ota, apk]
      channel:
        required: true
        type: choice
        options: [dev, prod]
permissions:
  contents: read
  actions: read
jobs:
  diagnostics-only:
    if: ${{ inputs.preflightOnly }}
    uses: ./.github/workflows/release-preflight.yml
    permissions:
      contents: read
  publish:
    if: ${{ !inputs.preflightOnly }}
    runs-on: [self-hosted, linux, x64, leader-release]
    timeout-minutes: 30
    environment: ${{ inputs.channel == 'dev' && 'development' || 'production' }}
    concurrency:
      group: leader-app-release-${{ inputs.channel }}
      cancel-in-progress: false
    env:
      OTA_CHANNEL: ${{ github.event_name == 'workflow_dispatch' && inputs.channel || github.ref_name == 'dev' && 'dev' || 'prod' }}
      OTA_PLATFORM: ${{ github.event_name == 'workflow_dispatch' && inputs.platform || 'android' }}
      OTA_ROLLOUT_PERCENT: ${{ github.event_name == 'workflow_dispatch' && inputs.rolloutPercent || '100' }}
      OTA_RELEASE_NOTES: ${{ github.event_name == 'workflow_dispatch' && inputs.releaseNotes || format('{0} OTA update', github.ref_name == 'dev' && 'Development' || 'Production') }}
      S3_ENDPOINT: ${{ secrets.BEGET_S3_ENDPOINT }}
      S3_REGION: ${{ secrets.BEGET_S3_REGION }}
      S3_BUCKET: ${{ secrets.BEGET_S3_BUCKET }}
      AWS_ACCESS_KEY_ID: ${{ secrets.BEGET_S3_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.BEGET_S3_SECRET_ACCESS_KEY }}
      EXPO_PUBLIC_UPDATE_CHANNEL: ${{ github.event_name == 'workflow_dispatch' && inputs.channel || github.ref_name == 'dev' && 'dev' || 'prod' }}
      EXPO_PUBLIC_API_URL_DEV: ${{ ((github.event_name == 'workflow_dispatch' && inputs.channel == 'dev') || (github.event_name != 'workflow_dispatch' && github.ref_name == 'dev')) && 'https://dev.lidprod.ru' || 'https://sibvod.ru' }}
      EXPO_PUBLIC_OTA_UPDATE_URL: ${{ ((github.event_name == 'workflow_dispatch' && inputs.channel == 'dev') || (github.event_name != 'workflow_dispatch' && github.ref_name == 'dev')) && 'https://dev.lidprod.ru/ota/update' || 'https://sibvod.ru/ota/update' }}
      EXPO_PUBLIC_MAP_STYLE_URL: https://tiles.openfreemap.org/styles/liberty
      EXPO_PUBLIC_TELEGRAM_BOT_USERNAME: ${{ secrets.EXPO_PUBLIC_TELEGRAM_BOT_USERNAME }}
      EXPO_PUBLIC_MAX_BOT_USERNAME: ${{ secrets.EXPO_PUBLIC_MAX_BOT_USERNAME }}
      EXPO_PUBLIC_SENTRY_ENABLED: 'true'
      EXPO_PUBLIC_SENTRY_DSN: ${{ secrets.EXPO_PUBLIC_SENTRY_DSN }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_READ_TOKEN: ${{ secrets.SENTRY_READ_TOKEN }}
      SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
      SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
      SENTRY_URL: http://127.0.0.1:19000
      EXPO_PUBLIC_SENTRY_ENVIRONMENT: ${{ ((github.event_name == 'workflow_dispatch' && inputs.channel == 'dev') || (github.event_name != 'workflow_dispatch' && github.ref_name == 'dev')) && 'development' || 'production' }}
      NODE_ENV: ${{ (github.event_name != 'workflow_dispatch' || inputs.channel == 'prod') && 'production' || 'development' }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: node scripts/checkReleaseDiagnostics.js
      - run: node scripts/checkReleaseTarget.js
      - name: Verify immutable source and unchanged application
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          RELEASE_KIND: ${{ inputs.kind }}
        run: node scripts/resolveReleaseSource.js
      - run: npm ci --include=dev
      - uses: actions/download-artifact@v7
        with:
          name: ${{ inputs.kind }}-candidate
          github-token: ${{ github.token }}
          run-id: ${{ inputs.source_run_id }}
      - name: Decrypt candidate
        run: |
          node scripts/releaseTransfer.js decrypt candidate.enc candidate.tar.gz /opt/leader-release/transfer-private.pem
          tar -tzf candidate.tar.gz > candidate-files.txt
          grep '^release-artifacts/' candidate-files.txt >/dev/null
          tar -xzf candidate.tar.gz
      - name: Validate candidate identity and APK hash
        env:
          RELEASE_KIND: ${{ inputs.kind }}
        run: node scripts/validateReleaseCandidate.js
      - name: Verify private diagnostic artifacts
        env:
          RELEASE_KIND: ${{ inputs.kind }}
        run: |
          export SENTRY_URL=http://127.0.0.1:19001
          node scripts/checkReleaseDiagnostics.js
          node scripts/checkSentryConfig.js
          target=dist-ota
          if [ "$RELEASE_KIND" = apk ]; then target=--apk; fi
          node scripts/uploadCrashSymbols.js "$target"
          if [ "$RELEASE_KIND" = apk ] && [ "$EXPO_PUBLIC_UPDATE_CHANNEL" = dev ]; then node scripts/uploadNativeCrashSymbols.js; fi
          node scripts/verifyCrashSymbols.js "$target"
      - name: Publish exact verified candidate
        env:
          RELEASE_KIND: ${{ inputs.kind }}
        run: |
          if [ "$RELEASE_KIND" = ota ]; then
            node scripts/relocateOtaMetadata.js release-artifacts/ota-metadata.json
            node scripts/uploadOtaToS3.js release-artifacts/ota-metadata.json
            node scripts/publishServerRelease.js ota release-artifacts/ota-metadata.json
            node scripts/verifyOtaManifest.js release-artifacts/ota-metadata.json
          else
            node - <<'NODE'
          const {execFileSync} = require('node:child_process');
          const m = require('./release-artifacts/release-metadata.json');
          execFileSync(process.execPath,['scripts/uploadApkToS3.js','release-artifacts/'+m.apkKey.split('/').pop(),m.apkKey],{stdio:'inherit'});
          NODE
            node scripts/publishServerRelease.js apk release-artifacts/release-metadata.json
          fi
      - name: Remove decrypted candidate
        if: always()
        run: |
          rm -f candidate.tar.gz candidate.enc candidate.enc.json candidate-files.txt
          node -e "for(const p of ['dist-ota','release-artifacts','android/app/build'])require('fs').rmSync(p,{recursive:true,force:true})"
