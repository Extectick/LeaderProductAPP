name: Publish OTA Update

on:
  push:
    branches: [dev, main, production]
  workflow_dispatch:
    inputs:
      channel:
        description: Update channel
        required: true
        default: dev
        type: choice
        options:
          - dev
          - prod
      platform:
        description: OTA platform
        required: true
        default: android
        type: choice
        options:
          - android
      runtimeVersion:
        description: Runtime version, must match app.config.ts version
        required: true
        type: string
      rolloutPercent:
        description: Rollout percent from 0 to 100
        required: true
        default: '100'
        type: string
      releaseNotes:
        description: Release notes
        required: false
        default: ''
        type: string

jobs:
  export-upload:
    runs-on: ubuntu-latest
    environment: ${{ ((github.event_name == 'workflow_dispatch' && inputs.channel == 'dev') || github.ref_name == 'dev') && 'development' || 'production' }}

    env:
      OTA_CHANNEL: ${{ github.event_name == 'workflow_dispatch' && inputs.channel || github.ref_name == 'dev' && 'dev' || 'prod' }}
      OTA_PLATFORM: ${{ github.event_name == 'workflow_dispatch' && inputs.platform || 'android' }}
      OTA_ROLLOUT_PERCENT: ${{ github.event_name == 'workflow_dispatch' && inputs.rolloutPercent || '100' }}
      OTA_RELEASE_NOTES: ${{ github.event_name == 'workflow_dispatch' && inputs.releaseNotes || format('{0} OTA update', github.ref_name == 'dev' && 'Development' || 'Production') }}
      S3_ENDPOINT: ${{ secrets.BEGET_S3_ENDPOINT }}
      S3_REGION: ${{ secrets.BEGET_S3_REGION }}
      S3_BUCKET: ${{ secrets.BEGET_S3_BUCKET }}
      AWS_ACCESS_KEY_ID: ${{ secrets.BEGET_S3_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.BEGET_S3_SECRET_ACCESS_KEY }}
      EXPO_PUBLIC_UPDATE_CHANNEL: ${{ github.event_name == 'workflow_dispatch' && inputs.channel || github.ref_name == 'dev' && 'dev' || 'prod' }}
      EXPO_PUBLIC_API_URL_DEV: ${{ ((github.event_name == 'workflow_dispatch' && inputs.channel == 'dev') || github.ref_name == 'dev') && 'https://dev.leader-product.ru' || 'https://api.leader-product.ru' }}
      EXPO_PUBLIC_OTA_UPDATE_URL: ${{ ((github.event_name == 'workflow_dispatch' && inputs.channel == 'dev') || github.ref_name == 'dev') && 'https://dev.leader-product.ru/ota/update' || 'https://api.leader-product.ru/ota/update' }}
      EXPO_PUBLIC_MAP_STYLE_URL: https://tiles.openfreemap.org/styles/liberty
      EXPO_PUBLIC_TELEGRAM_BOT_USERNAME: ${{ secrets.EXPO_PUBLIC_TELEGRAM_BOT_USERNAME }}
      EXPO_PUBLIC_MAX_BOT_USERNAME: ${{ secrets.EXPO_PUBLIC_MAX_BOT_USERNAME }}
      EXPO_PUBLIC_SENTRY_ENABLED: 'false'
      EXPO_PUBLIC_SENTRY_ENVIRONMENT: ${{ ((github.event_name == 'workflow_dispatch' && inputs.channel == 'dev') || github.ref_name == 'dev') && 'development' || 'production' }}
      NODE_ENV: production

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check OTA release strategy
        if: ${{ github.event_name == 'push' }}
        run: |
          node ./scripts/checkReleaseStrategy.js \
            --mode ota \
            --base "${{ github.event.before }}" \
            --head "${{ github.sha }}"

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Resolve runtime version
        id: version
        shell: bash
        run: |
          ACTUAL="$(node -e "console.log(require('./scripts/readNativeVersion').readVersion().versionName)")"
          EXPECTED="${{ github.event_name == 'workflow_dispatch' && inputs.runtimeVersion || '' }}"
          if [ -n "$EXPECTED" ] && [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "app.config.ts version is $ACTUAL, expected runtimeVersion $EXPECTED" >&2
            exit 1
          fi
          echo "Runtime version OK: $ACTUAL"
          echo "runtime_version=$ACTUAL" >> "$GITHUB_OUTPUT"

      - name: Export Android OTA bundle
        run: npx expo export --platform "$OTA_PLATFORM" --output-dir dist-ota

      - name: Create OTA metadata
        id: metadata
        shell: bash
        run: |
          node ./scripts/createOtaMetadata.js dist-ota \
            --out release-artifacts/ota-metadata.json \
            --platform "$OTA_PLATFORM" \
            --channel "$OTA_CHANNEL" \
            --runtimeVersion "${{ steps.version.outputs.runtime_version }}" \
            --rolloutPercent "$OTA_ROLLOUT_PERCENT" \
            --releaseNotes "$OTA_RELEASE_NOTES" \
            --commitSha "$GITHUB_SHA"
          echo "ota_metadata_b64=$(base64 -w0 release-artifacts/ota-metadata.json)" >> "$GITHUB_OUTPUT"

      - name: Upload OTA files to S3
        run: node ./scripts/uploadOtaToS3.js release-artifacts/ota-metadata.json

      - name: Publish OTA metadata in the target API
        uses: appleboy/ssh-action@v1
        env:
          OTA_METADATA_B64: ${{ steps.metadata.outputs.ota_metadata_b64 }}
          OTA_CHANNEL: ${{ env.OTA_CHANNEL }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: OTA_METADATA_B64,OTA_CHANNEL
          script: |
            set -euo pipefail

            if [ "$OTA_CHANNEL" = "dev" ]; then
              cd /opt/leader-api-dev
              printf '%s' "$OTA_METADATA_B64" | base64 -d | docker compose -f docker-compose.server-dev.yml exec -T api sh -lc '
                set -eu
                tmp_file="$(mktemp /tmp/leader-product-ota-release.XXXXXX)"
                cat > "$tmp_file"
                node scripts/publish-ota-update-db.js "$tmp_file"
                rm -f "$tmp_file"
              '
            else
              cd /opt/leader-api
              printf '%s' "$OTA_METADATA_B64" | base64 -d | docker compose -f docker-compose.yml -f docker-compose.prod.yml exec -T api sh -lc '
                set -eu
                tmp_file="$(mktemp /tmp/leader-product-ota-release.XXXXXX)"
                cat > "$tmp_file"
                node scripts/publish-ota-update-db.js "$tmp_file"
                rm -f "$tmp_file"
              '
            fi

      - name: Upload OTA artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ota-${{ env.OTA_CHANNEL }}-${{ env.OTA_PLATFORM }}-${{ steps.version.outputs.runtime_version }}
          path: release-artifacts/
          if-no-files-found: error
