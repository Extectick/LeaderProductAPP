name: Publish OTA Update

on:
  push:
    branches: [dev, main, production]
  workflow_dispatch:
    inputs:
      channel:
        description: Update channel
        required: true
        default: dev
        type: choice
        options:
          - dev
          - prod
      platform:
        description: OTA platform
        required: true
        default: android
        type: choice
        options:
          - android
      runtimeVersion:
        description: Runtime version, must match app.config.ts version
        required: true
        type: string
      rolloutPercent:
        description: Rollout percent from 0 to 100
        required: true
        default: '100'
        type: string
      releaseNotes:
        description: Release notes
        required: false
        default: ''
        type: string

jobs:
  release-preflight:
    uses: ./.github/workflows/release-preflight.yml
    with:
      channel: ${{ github.event_name == 'workflow_dispatch' && inputs.channel || github.ref_name == 'dev' && 'dev' || 'prod' }}
    permissions:
      contents: read
  order-integrity-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run test:unit -- --runInBand __tests__/adminRedesign.unit.test.ts
      - run: npm run test:unit -- --runInBand __tests__/serviceRoutes.unit.test.ts __tests__/servicesOffline.unit.test.ts __tests__/servicesHomeHeader.unit.test.ts __tests__/appThemeSurface.unit.test.ts __tests__/notFound.unit.test.ts
      - run: npm run test:unit -- --runInBand __tests__/help.client.unit.test.ts __tests__/helpUiLogic.unit.test.ts __tests__/helpDateFormatting.unit.test.ts __tests__/helpListClock.unit.test.ts __tests__/helpScreen.unit.test.ts __tests__/helpAssistantProgress.unit.test.ts __tests__/helpMessageSelectionRow.unit.test.ts __tests__/helpSocket.unit.test.ts __tests__/helpServiceFocus.unit.test.ts __tests__/helpCacheOpening.unit.test.ts __tests__/helpServiceHistory.unit.test.ts __tests__/helpServiceCommitted.unit.test.ts __tests__/helpAssistantService.unit.test.ts __tests__/helpComposer.unit.test.ts __tests__/helpMessageBubble.unit.test.ts __tests__/helpPrimitives.unit.test.ts __tests__/helpMedia.unit.test.ts __tests__/helpKeyboardInset.unit.test.ts __tests__/helpViewCache.unit.test.ts __tests__/helpOutgoingFirstPaint.unit.test.ts __tests__/helpMarkdown.unit.test.ts __tests__/helpTextReveal.unit.test.ts __tests__/helpTextRevealHook.unit.test.ts __tests__/helpMarkdownBlocks.unit.test.ts __tests__/helpStreamingText.unit.test.ts __tests__/helpAssistantMessage.unit.test.ts __tests__/helpAssistantSurface.unit.test.ts __tests__/helpQuestions.unit.test.ts __tests__/helpAssistantFiles.unit.test.ts __tests__/helpFileAttachment.unit.test.ts __tests__/helpAttachmentDownload.unit.test.ts __tests__/helpChatEntry.unit.test.ts __tests__/helpPhotoPicker.unit.test.ts __tests__/helpPhotoPreviewQueue.unit.test.ts __tests__/helpMessagePreview.unit.test.ts __tests__/helpOpeningScroll.unit.test.ts __tests__/helpTimeline.unit.test.ts __tests__/helpVoiceRecorder.unit.test.ts
      - run: npm run test:unit -- --runInBand __tests__/helpTimelineDates.unit.test.ts __tests__/helpTimelineIndicators.unit.test.ts __tests__/helpJumpToLatestModel.unit.test.ts __tests__/helpNavigationMotion.unit.test.ts __tests__/helpQuestionHydration.unit.test.ts __tests__/helpQuestionLayout.unit.test.ts __tests__/helpQuestionReveal.unit.test.ts __tests__/helpQuestionTransition.unit.test.ts __tests__/helpThemeIdentity.unit.test.ts __tests__/helpEmptyConversation.unit.test.ts
      - run: npm run test:unit -- --runInBand __tests__/otaManifestConfig.unit.test.ts
      - run: npm run test:unit -- --runInBand __tests__/helpProviderIdentity.unit.test.ts __tests__/helpTokenReads.unit.test.ts
      - run: npm run test:unit -- --runInBand __tests__/helpNotificationBridgeDelivery.unit.test.ts __tests__/helpNotificationDelivery.unit.test.ts __tests__/helpPushPresenceLifecycle.unit.test.ts __tests__/pushColdStartNavigation.unit.test.ts
      - run: npm run test:unit -- --runInBand __tests__/entityLinks.unit.test.ts __tests__/entityCardContext.unit.test.ts __tests__/entityCardPortal.unit.test.ts __tests__/entityCardState.unit.test.ts __tests__/entityCardProvider.unit.test.ts __tests__/entityCards.unit.test.ts
      - run: npm run test:unit -- --runInBand __tests__/helpViewerLayout.unit.test.ts __tests__/entityCardViewer.unit.test.ts __tests__/entityCardActions.unit.test.ts __tests__/entityCardHostLayout.unit.test.ts __tests__/entityCardBodyInset.unit.test.ts __tests__/helpChatSearch.unit.test.ts
      - run: npm run test:unit -- --runInBand __tests__/helpHtml.unit.test.ts __tests__/helpHtmlEntity.unit.test.ts __tests__/helpHtmlMessage.unit.test.ts __tests__/helpHtmlSurface.unit.test.ts __tests__/helpHtmlDownload.unit.test.ts __tests__/helpHtmlActions.unit.test.ts __tests__/helpHtmlViewer.unit.test.ts __tests__/helpHtmlMessageRoute.unit.test.ts __tests__/helpHtmlRecycling.unit.test.ts
      - run: npm run test:unit -- --runInBand __tests__/draftReview.unit.test.ts __tests__/clientOrderMarkup.unit.test.ts
      - run: npm run test:unit -- --runInBand __tests__/orderSharing.unit.test.ts __tests__/legacyOrderRecovery.unit.test.ts
      - run: npm run test:unit -- --runInBand __tests__/orderHeaderActions.unit.test.ts
      - run: npm run test:unit -- --runInBand __tests__/stockProductsScreen.unit.test.ts __tests__/stockProducts.unit.test.ts __tests__/stockProductRow.unit.test.ts __tests__/warehouseBalances.unit.test.ts __tests__/stockIncomingCost.unit.test.ts __tests__/stockMovementRow.unit.test.ts __tests__/receiptPresentation.unit.test.ts __tests__/salesPresentation.unit.test.ts __tests__/stockTabs.unit.test.ts __tests__/stockTabsPager.unit.test.ts __tests__/stockCache.unit.test.ts __tests__/warehouseSelection.unit.test.ts __tests__/filterLookupPickerPanel.unit.test.ts __tests__/clientOrdersShared.unit.test.ts
      - run: npm run test:unit -- --runInBand __tests__/stockGestureLists.unit.test.ts __tests__/salesAnalytics.unit.test.ts __tests__/stockSalesChart.unit.test.ts __tests__/useSalesRange.unit.test.ts
      - run: npm run test:unit -- --runInBand __tests__/galleryHistory.unit.test.ts
      - run: npm run test:unit -- --runInBand __tests__/clientContactsEditor.unit.test.ts
      - run: npm run test:unit -- --runInBand __tests__/profileSettings.unit.test.ts __tests__/profileOnecReturn.unit.test.ts __tests__/trackingV2Lifecycle.unit.test.ts
      - run: npm run test:unit -- --runInBand __tests__/profilePresentation.unit.test.ts __tests__/profileHome.unit.test.ts __tests__/profilePersonal.unit.test.ts __tests__/profileNotifications.unit.test.ts __tests__/profileNavigation.unit.test.ts __tests__/profileCache.unit.test.ts __tests__/profileChrome.unit.test.ts
      - run: npm run test:unit -- --runInBand __tests__/catalogProductOrdering.unit.test.ts __tests__/productCatalogIntegration.unit.test.ts __tests__/offlineSqlite.unit.test.ts __tests__/catalogDatabaseLifecycle.unit.test.ts
      - run: npm run test:unit -- --runInBand __tests__/productionMonitoring.unit.test.ts __tests__/deviceDraftRecovery.unit.test.ts __tests__/orderOperationIntegrity.unit.test.ts __tests__/clientOrdersShared.unit.test.ts __tests__/clientOrdersService.unit.test.ts __tests__/httpClient.unit.test.ts __tests__/useClientOrdersWorkspace.unit.test.ts

  export-upload:
    needs: [order-integrity-check, release-preflight]
    runs-on: ubuntu-latest
    environment: ${{ ((github.event_name == 'workflow_dispatch' && inputs.channel == 'dev') || (github.event_name != 'workflow_dispatch' && github.ref_name == 'dev')) && 'development' || 'production' }}

    env:
      OTA_CHANNEL: ${{ github.event_name == 'workflow_dispatch' && inputs.channel || github.ref_name == 'dev' && 'dev' || 'prod' }}
      OTA_PLATFORM: ${{ github.event_name == 'workflow_dispatch' && inputs.platform || 'android' }}
      OTA_ROLLOUT_PERCENT: ${{ github.event_name == 'workflow_dispatch' && inputs.rolloutPercent || '100' }}
      OTA_RELEASE_NOTES: ${{ github.event_name == 'workflow_dispatch' && inputs.releaseNotes || format('{0} OTA update', github.ref_name == 'dev' && 'Development' || 'Production') }}
      S3_ENDPOINT: ${{ secrets.BEGET_S3_ENDPOINT }}
      S3_REGION: ${{ secrets.BEGET_S3_REGION }}
      S3_BUCKET: ${{ secrets.BEGET_S3_BUCKET }}
      AWS_ACCESS_KEY_ID: ${{ secrets.BEGET_S3_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.BEGET_S3_SECRET_ACCESS_KEY }}
      EXPO_PUBLIC_UPDATE_CHANNEL: ${{ github.event_name == 'workflow_dispatch' && inputs.channel || github.ref_name == 'dev' && 'dev' || 'prod' }}
      EXPO_PUBLIC_API_URL_DEV: ${{ ((github.event_name == 'workflow_dispatch' && inputs.channel == 'dev') || (github.event_name != 'workflow_dispatch' && github.ref_name == 'dev')) && 'https://dev.lidprod.ru' || 'https://sibvod.ru' }}
      EXPO_PUBLIC_OTA_UPDATE_URL: ${{ ((github.event_name == 'workflow_dispatch' && inputs.channel == 'dev') || (github.event_name != 'workflow_dispatch' && github.ref_name == 'dev')) && 'https://dev.lidprod.ru/ota/update' || 'https://sibvod.ru/ota/update' }}
      EXPO_PUBLIC_MAP_STYLE_URL: https://tiles.openfreemap.org/styles/liberty
      EXPO_PUBLIC_TELEGRAM_BOT_USERNAME: ${{ secrets.EXPO_PUBLIC_TELEGRAM_BOT_USERNAME }}
      EXPO_PUBLIC_MAX_BOT_USERNAME: ${{ secrets.EXPO_PUBLIC_MAX_BOT_USERNAME }}
      EXPO_PUBLIC_SENTRY_ENABLED: ${{ ((github.event_name == 'workflow_dispatch' && inputs.channel == 'dev') || (github.event_name != 'workflow_dispatch' && github.ref_name == 'dev')) && 'false' || 'true' }}
      EXPO_PUBLIC_SENTRY_DSN: ${{ !((github.event_name == 'workflow_dispatch' && inputs.channel == 'dev') || (github.event_name != 'workflow_dispatch' && github.ref_name == 'dev')) && secrets.EXPO_PUBLIC_SENTRY_DSN || '' }}
      SENTRY_AUTH_TOKEN: ${{ !((github.event_name == 'workflow_dispatch' && inputs.channel == 'dev') || (github.event_name != 'workflow_dispatch' && github.ref_name == 'dev')) && secrets.SENTRY_AUTH_TOKEN || '' }}
      SENTRY_READ_TOKEN: ${{ !((github.event_name == 'workflow_dispatch' && inputs.channel == 'dev') || (github.event_name != 'workflow_dispatch' && github.ref_name == 'dev')) && secrets.SENTRY_READ_TOKEN || '' }}
      SENTRY_ORG: ${{ !((github.event_name == 'workflow_dispatch' && inputs.channel == 'dev') || (github.event_name != 'workflow_dispatch' && github.ref_name == 'dev')) && secrets.SENTRY_ORG || '' }}
      SENTRY_PROJECT: ${{ !((github.event_name == 'workflow_dispatch' && inputs.channel == 'dev') || (github.event_name != 'workflow_dispatch' && github.ref_name == 'dev')) && secrets.SENTRY_PROJECT || '' }}
      SENTRY_URL: http://127.0.0.1:19000
      EXPO_PUBLIC_SENTRY_ENVIRONMENT: ${{ ((github.event_name == 'workflow_dispatch' && inputs.channel == 'dev') || (github.event_name != 'workflow_dispatch' && github.ref_name == 'dev')) && 'development' || 'production' }}
      NODE_ENV: ${{ (github.event_name != 'workflow_dispatch' || inputs.channel == 'prod') && 'production' || 'development' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check OTA release strategy
        if: ${{ github.event_name == 'push' }}
        run: |
          node ./scripts/checkReleaseStrategy.js \
            --mode ota \
            --base "${{ github.event.before }}" \
            --head "${{ github.sha }}"

      - name: Validate branch and release target
        run: node scripts/checkReleaseTarget.js
      - name: Test encrypted release transport
        run: node --test scripts/releaseTransfer.test.js

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Use current development monitoring host
        if: env.EXPO_PUBLIC_UPDATE_CHANNEL == 'dev'
        run: node scripts/configureDevBuildHost.js

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Resolve runtime version
        id: version
        shell: bash
        run: |
          ACTUAL="$(node -e "console.log(require('./scripts/readNativeVersion').readVersion().versionName)")"
          EXPECTED="${{ github.event_name == 'workflow_dispatch' && inputs.runtimeVersion || '' }}"
          if [ -n "$EXPECTED" ] && [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "app.config.ts version is $ACTUAL, expected runtimeVersion $EXPECTED" >&2
            exit 1
          fi
          echo "Runtime version OK: $ACTUAL"
          echo "runtime_version=$ACTUAL" >> "$GITHUB_OUTPUT"
          BUILD="$(node -e "console.log(require('./scripts/readNativeVersion').readVersion().versionCode)")"
          echo "SENTRY_DIST=$BUILD" >> "$GITHUB_ENV"
          echo "EXPO_PUBLIC_SENTRY_RELEASE=com.leaderproduct.app@$ACTUAL+$BUILD-ota.${GITHUB_SHA:0:12}" >> "$GITHUB_ENV"

      - name: Validate crash-reporting target
        run: node scripts/checkSentryConfig.js

      - name: Export Android OTA bundle
        run: |
          node scripts/createAdminGitCatalog.cjs
          npx expo export --platform "$OTA_PLATFORM" --output-dir dist-ota --source-maps --clear

      - name: Create OTA metadata
        id: metadata
        shell: bash
        run: |
          node ./scripts/createOtaMetadata.js dist-ota \
            --out release-artifacts/ota-metadata.json \
            --platform "$OTA_PLATFORM" \
            --channel "$OTA_CHANNEL" \
            --runtimeVersion "${{ steps.version.outputs.runtime_version }}" \
            --rolloutPercent "$OTA_ROLLOUT_PERCENT" \
            --releaseNotes "$OTA_RELEASE_NOTES" \
            --commitSha "$GITHUB_SHA"
          echo "ota_metadata_b64=$(base64 -w0 release-artifacts/ota-metadata.json)" >> "$GITHUB_OUTPUT"

      - name: Encrypt release candidate and private symbols
        run: |
          node scripts/releaseDiagnosticsPolicy.js record
          tar -czf candidate.tar.gz dist-ota release-artifacts
          node scripts/releaseTransfer.js encrypt candidate.tar.gz candidate.enc scripts/release-transfer-public.pem
      - uses: actions/upload-artifact@v7
        with:
          name: ota-candidate
          path: |
            candidate.enc
            candidate.enc.json
          retention-days: 2
          if-no-files-found: error

  publish:
    needs: export-upload
    runs-on: [self-hosted, linux, x64, leader-release]
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    environment: ${{ ((github.event_name == 'workflow_dispatch' && inputs.channel == 'dev') || (github.event_name != 'workflow_dispatch' && github.ref_name == 'dev')) && 'development' || 'production' }}
    concurrency:
      group: leader-app-release-${{ github.event_name == 'workflow_dispatch' && inputs.channel || github.ref_name == 'dev' && 'dev' || 'prod' }}
      cancel-in-progress: false

    env:
      OTA_CHANNEL: ${{ github.event_name == 'workflow_dispatch' && inputs.channel || github.ref_name == 'dev' && 'dev' || 'prod' }}
      OTA_PLATFORM: ${{ github.event_name == 'workflow_dispatch' && inputs.platform || 'android' }}
      OTA_ROLLOUT_PERCENT: ${{ github.event_name == 'workflow_dispatch' && inputs.rolloutPercent || '100' }}
      OTA_RELEASE_NOTES: ${{ github.event_name == 'workflow_dispatch' && inputs.releaseNotes || format('{0} OTA update', github.ref_name == 'dev' && 'Development' || 'Production') }}
      S3_ENDPOINT: ${{ secrets.BEGET_S3_ENDPOINT }}
      S3_REGION: ${{ secrets.BEGET_S3_REGION }}
      S3_BUCKET: ${{ secrets.BEGET_S3_BUCKET }}
      AWS_ACCESS_KEY_ID: ${{ secrets.BEGET_S3_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.BEGET_S3_SECRET_ACCESS_KEY }}
      EXPO_PUBLIC_UPDATE_CHANNEL: ${{ github.event_name == 'workflow_dispatch' && inputs.channel || github.ref_name == 'dev' && 'dev' || 'prod' }}
      EXPO_PUBLIC_API_URL_DEV: ${{ ((github.event_name == 'workflow_dispatch' && inputs.channel == 'dev') || (github.event_name != 'workflow_dispatch' && github.ref_name == 'dev')) && 'https://dev.lidprod.ru' || 'https://sibvod.ru' }}
      EXPO_PUBLIC_OTA_UPDATE_URL: ${{ ((github.event_name == 'workflow_dispatch' && inputs.channel == 'dev') || (github.event_name != 'workflow_dispatch' && github.ref_name == 'dev')) && 'https://dev.lidprod.ru/ota/update' || 'https://sibvod.ru/ota/update' }}
      EXPO_PUBLIC_MAP_STYLE_URL: https://tiles.openfreemap.org/styles/liberty
      EXPO_PUBLIC_TELEGRAM_BOT_USERNAME: ${{ secrets.EXPO_PUBLIC_TELEGRAM_BOT_USERNAME }}
      EXPO_PUBLIC_MAX_BOT_USERNAME: ${{ secrets.EXPO_PUBLIC_MAX_BOT_USERNAME }}
      EXPO_PUBLIC_SENTRY_ENABLED: ${{ ((github.event_name == 'workflow_dispatch' && inputs.channel == 'dev') || (github.event_name != 'workflow_dispatch' && github.ref_name == 'dev')) && 'false' || 'true' }}
      EXPO_PUBLIC_SENTRY_DSN: ${{ !((github.event_name == 'workflow_dispatch' && inputs.channel == 'dev') || (github.event_name != 'workflow_dispatch' && github.ref_name == 'dev')) && secrets.EXPO_PUBLIC_SENTRY_DSN || '' }}
      SENTRY_AUTH_TOKEN: ${{ !((github.event_name == 'workflow_dispatch' && inputs.channel == 'dev') || (github.event_name != 'workflow_dispatch' && github.ref_name == 'dev')) && secrets.SENTRY_AUTH_TOKEN || '' }}
      SENTRY_READ_TOKEN: ${{ !((github.event_name == 'workflow_dispatch' && inputs.channel == 'dev') || (github.event_name != 'workflow_dispatch' && github.ref_name == 'dev')) && secrets.SENTRY_READ_TOKEN || '' }}
      SENTRY_ORG: ${{ !((github.event_name == 'workflow_dispatch' && inputs.channel == 'dev') || (github.event_name != 'workflow_dispatch' && github.ref_name == 'dev')) && secrets.SENTRY_ORG || '' }}
      SENTRY_PROJECT: ${{ !((github.event_name == 'workflow_dispatch' && inputs.channel == 'dev') || (github.event_name != 'workflow_dispatch' && github.ref_name == 'dev')) && secrets.SENTRY_PROJECT || '' }}
      SENTRY_URL: http://127.0.0.1:19000
      EXPO_PUBLIC_SENTRY_ENVIRONMENT: ${{ ((github.event_name == 'workflow_dispatch' && inputs.channel == 'dev') || (github.event_name != 'workflow_dispatch' && github.ref_name == 'dev')) && 'development' || 'production' }}
      NODE_ENV: ${{ (github.event_name != 'workflow_dispatch' || inputs.channel == 'prod') && 'production' || 'development' }}

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: node scripts/checkReleaseTarget.js
      - run: npm ci --include=dev
      - uses: actions/download-artifact@v7
        with:
          name: ota-candidate
      - name: Decrypt verified CI candidate
        run: |
          node scripts/releaseTransfer.js decrypt candidate.enc candidate.tar.gz /opt/leader-release/transfer-private.pem
          tar -tzf candidate.tar.gz > candidate-files.txt
          grep '^release-artifacts/' candidate-files.txt >/dev/null
          tar -xzf candidate.tar.gz
      - name: Set diagnostic release identity
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const v = require('./scripts/readNativeVersion').readVersion();
          const suffix = 'ota' === 'ota' ? '-ota.' + process.env.GITHUB_SHA.slice(0,12) : '';
          fs.appendFileSync(process.env.GITHUB_ENV, 'SENTRY_DIST=' + v.versionCode + '\nEXPO_PUBLIC_SENTRY_RELEASE=com.leaderproduct.app@' + v.versionName + '+' + v.versionCode + suffix + '\n');
          NODE
      - name: Upload and verify private crash symbols
        if: ${{ env.EXPO_PUBLIC_SENTRY_ENABLED == 'true' }}
        run: |
          export SENTRY_URL=http://127.0.0.1:19001
          node scripts/checkReleaseDiagnostics.js
          node scripts/checkSentryConfig.js
          curl --fail --silent --max-time 15 "$SENTRY_URL/_health/" >/dev/null
          node scripts/uploadCrashSymbols.js dist-ota
          node scripts/verifyCrashSymbols.js dist-ota
      - name: Upload OTA assets
        run: |
          node scripts/relocateOtaMetadata.js release-artifacts/ota-metadata.json
          node scripts/uploadOtaToS3.js release-artifacts/ota-metadata.json
      - name: Publish OTA metadata
        run: node scripts/publishServerRelease.js ota release-artifacts/ota-metadata.json
      - name: Verify public OTA manifest
        if: ${{ env.OTA_ROLLOUT_PERCENT != '0' }}
        run: node scripts/verifyOtaManifest.js release-artifacts/ota-metadata.json
      - name: Remove decrypted candidate and symbols
        if: always()
        run: |
          rm -f candidate.tar.gz candidate.enc candidate.enc.json
          node -e "for(const p of ['dist-ota','release-artifacts','android/app/build'])require('fs').rmSync(p,{recursive:true,force:true})"
