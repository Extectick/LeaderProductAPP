name: Release diagnostics preflight
on:
  workflow_call:
    inputs:
      channel:
        type: string
        default: prod
        required: false
  workflow_dispatch:
    inputs:
      channel:
        type: choice
        options: [prod, dev]
        default: prod
        required: true
permissions:
  contents: read
jobs:
  diagnostics:
    runs-on: [self-hosted, linux, x64, leader-release]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: node --test scripts/checkReleaseDiagnostics.test.js scripts/releaseDiagnosticsPolicy.test.js
      - name: Validate release channel
        env:
          RELEASE_CHANNEL: ${{ inputs.channel }}
        run: node -e "require('./scripts/releaseDiagnosticsPolicy').validateChannel(process.env.RELEASE_CHANNEL)"
      - if: ${{ inputs.channel != 'dev' }}
        run: node scripts/checkReleaseDiagnostics.js
