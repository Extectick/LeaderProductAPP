name: Build Web Image
on:
  push:
    branches: [dev, main, production]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build-and-push:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'dev' && 'development' || 'production' }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate release branch
        env:
          REF: ${{ github.ref_name }}
        run: |
          case "$REF" in dev|main|production) ;; *) exit 1;; esac
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.web
          push: true
          tags: |
            ghcr.io/extectick/leaderproductapp:${{ github.sha }}
            ghcr.io/extectick/leaderproductapp:${{ github.ref_name == 'dev' && 'dev' || 'latest' }}
          build-args: |
            EXPO_PUBLIC_API_URL_DEV=${{ github.ref_name == 'dev' && 'https://dev.lidprod.ru' || 'https://sibvod.ru' }}
            EXPO_PUBLIC_MAP_STYLE_URL=https://tiles.openfreemap.org/styles/liberty
            EXPO_PUBLIC_TELEGRAM_BOT_USERNAME=${{ secrets.EXPO_PUBLIC_TELEGRAM_BOT_USERNAME }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Hosting is managed separately
        run: echo "Web image published. This host has no web application service; API/nginx must not be replaced by the web build." >> "$GITHUB_STEP_SUMMARY"
