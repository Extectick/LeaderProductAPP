plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}
group = 'expo.modules.leaderhelpinput'
version = '1.0.0'
dependencies {
  // The native tail owner observes ReactScrollView's synchronous drag events.
  // Resolve the same React Android version supplied by the app/Expo plugin.
  implementation 'com.facebook.react:react-android'
  testImplementation 'junit:junit:4.13.2'
}
android {
  namespace 'expo.modules.leaderhelpinput'
  defaultConfig { versionCode 1; versionName '1.0.0' }
}
