# Standalone production SPA; API remains at https://api.lidprod.ru.
map $uri $leader_app_prod_cache {
    default "no-store, max-age=0";
    ~^/_expo/static/ "public, max-age=31536000, immutable";
    ~^/assets/ "public, max-age=3600";
}
server {
    listen 80;
    server_name app.lidprod.ru;
    access_log off;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 308 https://app.lidprod.ru$request_uri; }
}
server {
    listen 443 ssl;
    server_name app.lidprod.ru;
    access_log off;
    ssl_certificate /etc/letsencrypt/live/app.lidprod.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.lidprod.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:LEADER_APP_PROD_TLS:10m;
    if ($host != app.lidprod.ru) { return 421; }
    root /var/www/releases/app-web/current;
    index index.html;
    charset utf-8;
    add_header Cache-Control $leader_app_prod_cache always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    gzip on;
    gzip_types text/css application/javascript application/json application/wasm image/svg+xml;
    gzip_min_length 1024;
    location ^~ /_expo/static/ { try_files $uri =404; }
    location ^~ /assets/ { try_files $uri =404; }
    location ~ /\. { return 404; }
    location / { try_files $uri $uri/ /index.html; }
}
